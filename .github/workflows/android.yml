name: 建置 Android APK

# 產出可以直接下載安裝的 APK，放到 Releases。
#
# 兩種觸發：
#   - 手動按（workflow_dispatch）→ 產出 debug APK 當 artifact，測試用
#   - 推 tag（v1.1 這種）→ 產出 release APK + AAB，發到 Releases 讓人下載
#
# 完全免費：GitHub Actions 對公開 repo 不計費，也不需要 Google Play 帳號。
# 要上 Play 商店才需要那筆一次性的 US$25。

on:
  workflow_dispatch:
    inputs:
      release:
        description: "建 release 版（需要已設定簽章 secrets）"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write        # 建立 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"        # Capacitor 6 + AGP 8 需要 JDK 17 以上

      - uses: android-actions/setup-android@v3
        with:
          # 預設會裝 'tools'，這個套件 Google 已經下架，sdkmanager 會直接失敗
          packages: platform-tools

      # node_modules 與 Gradle 快取，第二次之後會快很多
      - uses: actions/cache@v4
        with:
          path: |
            mobile/node_modules
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ hashFiles('mobile/package.json') }}-${{ hashFiles('mobile/android/**/*.gradle') }}
          restore-keys: android-${{ hashFiles('mobile/package.json') }}-

      - name: 安裝相依套件
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: 產生 www/ 與原生專案
        working-directory: mobile
        run: |
          npm run prepare:www
          # android/ 不進版控（產出物），每次重新產生才不會累積髒東西
          npx cap add android
          node scripts/make-resources.mjs
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0b0f14' \
            --splashBackgroundColor '#0b0f14' || echo "⚠ 圖示產生失敗，用預設圖示繼續"
          npx cap sync android

      - name: 補上背景定位所需的原生設定
        working-directory: mobile
        run: node scripts/patch-android.mjs

      # 這一步是刻意的：patch 腳本自己會 exit 1，但再檢查一次，
      # 因為「權限漏掉」的症狀是「關螢幕才沒聲音」，CI 抓不到就會出到使用者手上。
      - name: 驗證 AndroidManifest 真的有背景定位權限
        working-directory: mobile
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          for P in ACCESS_FINE_LOCATION ACCESS_BACKGROUND_LOCATION FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS; do
            grep -q "android.permission.$P" "$MF" || { echo "✗ 缺少 $P"; exit 1; }
          done
          grep -q 'foregroundServiceType="location"' "$MF" || { echo "✗ 前景服務型別不對"; exit 1; }
          echo "✓ 背景定位設定齊全"

      - name: 建置 debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      # ── 以下只有 release 才跑 ──
      - name: 還原簽章金鑰
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "有簽章=false" && echo "signed=false" >> $GITHUB_OUTPUT
            echo "⚠ 沒有設定 ANDROID_KEYSTORE_BASE64，只產出 debug APK。"
            echo "  debug APK 可以安裝也可以用，只是每次重建的簽章不同，無法覆蓋更新。"
          else
            echo "$KS" | base64 -d > mobile/android/app/luleopard.keystore
            echo "signed=true" >> $GITHUB_OUTPUT
          fi

      - name: 建置 release APK 與 AAB
        if: steps.keystore.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/luleopard.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: 整理產出
        run: |
          mkdir -p out
          # 有簽章的正式版就只放正式版（app-release.apk / .aab），避免使用者下載到 debug 版；
          # intermediary-bundle.aab 是 Gradle 的中間產物，一律不放
          if ls mobile/android/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            cp mobile/android/app/build/outputs/apk/release/*.apk out/
            cp mobile/android/app/build/outputs/bundle/release/*.aab out/ 2>/dev/null || true
          else
            cp mobile/android/app/build/outputs/apk/debug/*.apk out/
          fi
          ls -la out
          echo "### 📦 建置產出" >> $GITHUB_STEP_SUMMARY
          ls -lh out | tail -n +2 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: luleopard-android
          path: out/*
          retention-days: 30

      - name: 發佈到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## 鹿豹 Android 版

            **網頁版不用安裝**：直接開網址、加到主畫面就能用。
            只有需要「關螢幕／切到其他 App 仍持續警示」時才需要裝這個 APK。

            ### 安裝方式
            1. 在手機上點下面的 **`app-release.apk`** 下載
            2. 開啟下載的檔案 → 手機會擋「不明來源」→ 按「設定」→ 允許這個來源 → 返回繼續安裝
            3. 如果手機已經裝過網頁版的「鹿豹」捷徑，兩個可以並存；之後用這個 App 就好

            ### 第一次開啟後，一定要做這兩件事（不然關螢幕就不會播報）
            1. **定位改成「一律允許」**：設定 → 應用程式 → 鹿豹 → 權限 → 位置資訊 → **一律允許**，並打開「使用精確位置」
               （Android 不讓 App 直接要「一律允許」，只選「使用時允許」的話關螢幕就停了）
            2. **電池不限制**：設定 → 應用程式 → 鹿豹 → 電池 → **不限制**
               （三星、小米、OPPO 等預設會把背景 App 關掉；有「睡眠中的應用程式」清單的，也把鹿豹移出）

            開始導航後，通知列會出現「鹿豹 · 行車警示中」—— 有這行就代表背景警示在運作。

            ### 更新
            之後的新版直接下載安裝就會覆蓋，設定與權限都會保留。

            ⚠️ 行車安全提醒工具，請以現場標誌與實際路況為準，行進中請勿操作手機。
